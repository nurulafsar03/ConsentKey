<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients for Outer Location Pin -->
    <linearGradient id="pinLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#195ab8" />
      <stop offset="100%" stop-color="#123e85" />
    </linearGradient>
    <linearGradient id="pinRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7be8" />
      <stop offset="100%" stop-color="#1a5fc0" />
    </linearGradient>

    <!-- Gradients for Shield Body -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1856b3" />
      <stop offset="100%" stop-color="#123d82" />
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e80ee" />
      <stop offset="100%" stop-color="#1d66cc" />
    </linearGradient>

    <!-- Gradients for Padlock Shackle -->
    <linearGradient id="shackleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174f9e" />
      <stop offset="100%" stop-color="#103672" />
    </linearGradient>
    <linearGradient id="shackleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c78dc" />
      <stop offset="100%" stop-color="#1858b4" />
    </linearGradient>

    <!-- Neon Green Glow for Keyhole -->
    <radialGradient id="keyholeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="1" />
      <stop offset="35%" stop-color="#22c55e" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#16a34a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f2942" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Left Broadcast Waves (3 Arcs) -->
  <g stroke="#5eb2f8" stroke-width="18" stroke-linecap="round" fill="none">
    <!-- Inner Left Wave -->
    <path d="M 124 330 A 172 172 0 0 0 52 422" />
    <!-- Middle Left Wave -->
    <path d="M 98 306 A 218 218 0 0 0 14 424" stroke-width="17" />
    <!-- Outer Left Wave -->
    <path d="M 74 286 A 264 264 0 0 0 -18 418" stroke-width="16" opacity="0.9" />
  </g>

  <!-- Right Broadcast Waves (3 Arcs) -->
  <g stroke="#5eb2f8" stroke-width="18" stroke-linecap="round" fill="none">
    <!-- Inner Right Wave -->
    <path d="M 388 330 A 172 172 0 0 1 460 422" />
    <!-- Middle Right Wave -->
    <path d="M 414 306 A 218 218 0 0 1 498 424" stroke-width="17" />
    <!-- Outer Right Wave -->
    <path d="M 438 286 A 264 264 0 0 1 530 418" stroke-width="16" opacity="0.9" />
  </g>

  <!-- Main Map Pin Shape with Split Shading and Hollow Ring Frame -->
  <g filter="url(#subtleShadow)">
    <!-- Outer Pin Left Half -->
    <path d="M 256 468 
             C 246 450 120 300 100 236 
             A 160 160 0 0 1 256 44 
             L 256 94 
             A 114 114 0 0 0 148 224 
             C 160 262 216 322 256 348 
             Z" 
          fill="url(#pinLeft)" />

    <!-- Outer Pin Right Half -->
    <path d="M 256 468 
             C 266 450 392 300 412 236 
             A 160 160 0 0 0 256 44 
             L 256 94 
             A 114 114 0 0 1 364 224 
             C 352 262 296 322 256 348 
             Z" 
          fill="url(#pinRight)" />
  </g>

  <!-- Consent Soft-Green Checkmark at Bottom Tip -->
  <path d="M 238 388 L 256 406 L 298 358" 
        fill="none" 
        stroke="#5eead4" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Padlock Shackle (Top Arch) -->
  <g filter="url(#subtleShadow)">
    <!-- Shackle Left Half -->
    <path d="M 256 48 
             A 62 62 0 0 0 194 110 
             L 194 150 
             L 220 150 
             L 220 110 
             A 36 36 0 0 1 256 74 
             Z" 
          fill="url(#shackleLeft)" />

    <!-- Shackle Right Half -->
    <path d="M 256 48 
             A 62 62 0 0 1 318 110 
             L 318 150 
             L 292 150 
             L 292 110 
             A 36 36 0 0 0 256 74 
             Z" 
          fill="url(#shackleRight)" />
  </g>

  <!-- Central Shield Body (Split Tone) -->
  <g filter="url(#subtleShadow)">
    <!-- Shield Left Half -->
    <path d="M 256 138 
             L 174 152 
             C 168 153 164 157 164 163 
             L 164 228 
             C 164 274 212 320 256 338 
             Z" 
          fill="url(#shieldLeft)" />

    <!-- Shield Right Half -->
    <path d="M 256 138 
             L 338 152 
             C 344 153 348 157 348 163 
             L 348 228 
             C 348 274 300 320 256 338 
             Z" 
          fill="url(#shieldRight)" />
  </g>

  <!-- Center Keyhole Neon Glow & Aperture -->
  <!-- Glowing Neon Green Aura -->
  <circle cx="256" cy="226" r="46" fill="url(#keyholeGlow)" />

  <!-- Inner Keyhole Silhouette -->
  <path d="M 256 200 
           A 22 22 0 0 0 234 222 
           C 234 230 238 237 244 241 
           L 237 274 
           L 275 274 
           L 268 241 
           C 274 237 278 230 278 222 
           A 22 22 0 0 0 256 200 
           Z" 
        fill="#071b30" />
</svg>
