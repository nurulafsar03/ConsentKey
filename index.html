      (function () {
        // Universal console interceptor to completely silence [vite] HMR & WebSocket noise
        var methods = ['log', 'info', 'warn', 'error', 'debug'];
        for (var m = 0; m < methods.length; m++) {
          (function (methodName) {
            var orig = console[methodName];
            if (!orig) return;
            console[methodName] = function () {
              for (var i = 0; i < arguments.length; i++) {
                var str = String(arguments[i] || '');
                if (
                  str.indexOf('[vite]') !== -1 ||
                  str.indexOf('vite-hmr') !== -1 ||
                  str.indexOf('vite-ping') !== -1 ||
                  str.indexOf('websocket') !== -1 ||
                  str.indexOf('WebSocket') !== -1
                ) {
                  return;
                }
              }
              return orig.apply(console, arguments);
            };
          })(methods[m]);
        }

        // Intercept Vite HMR WebSocket in Cloud Run sandbox environment
        var NativeWS = window.WebSocket;
        if (NativeWS) {
          function FakeViteWS(url, protocols) {
            var urlStr = String(url || '');
            if (
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              urlStr.indexOf('vite') !== -1 ||
              urlStr.indexOf('token=') !== -1 ||
              urlStr.indexOf('24678') !== -1
            ) {
              var target = new EventTarget();
              target.url = url;
              target.protocols = protocols;
              target.readyState = 1; // WebSocket.OPEN
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.onopen = null;
              target.onmessage = null;
              target.onerror = null;
              target.onclose = null;
              target.send = function () {};
              target.close = function () {
                target.readyState = 3;
                if (typeof target.onclose === 'function') {
                  try {
                    target.onclose(new Event('close'));
                  } catch (e) {}
                }
              };
              setTimeout(function () {
                target.readyState = 1;
                if (typeof target.onopen === 'function') {
                  try {
                    target.onopen(new Event('open'));
                  } catch (e) {}
                }
                try {
                  target.dispatchEvent(new Event('open'));
                } catch (e) {}
              }, 0);
              return target;
            }
            return new NativeWS(url, protocols);
          }
          FakeViteWS.prototype = NativeWS.prototype;
          FakeViteWS.OPEN = 1;
          FakeViteWS.CONNECTING = 0;
          FakeViteWS.CLOSING = 2;
          FakeViteWS.CLOSED = 3;
          window.WebSocket = FakeViteWS;
        }

        window.addEventListener('error', function (e) {
          var msg = e && e.message ? String(e.message) : '';
          if (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason ? String(e.reason) : '';
          if (reason.indexOf('[vite]') !== -1 || reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
